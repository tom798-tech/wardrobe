name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start backend dependencies
        run: |
          docker compose up -d mysql redis postgres rabbitmq mock-embedding
          for container in wardrobe-mysql wardrobe-redis wardrobe-postgres wardrobe-rabbitmq wardrobe-mock-embedding; do
            echo "Waiting for ${container}..."
            timeout 180 bash -c "until [ \"\$(docker inspect --format='{{.State.Health.Status}}' ${container})\" = healthy ]; do sleep 3; done"
          done

      - name: Import MySQL schema and seed data
        run: |
          docker compose exec -T mysql mysql --default-character-set=utf8mb4 -uroot -p123456 wardrobe < wardrobe.sql

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Print dependency logs on failure
        if: failure()
        run: docker compose logs --no-color mysql redis postgres rabbitmq mock-embedding

      - name: Stop dependencies
        if: always()
        run: docker compose down -v
