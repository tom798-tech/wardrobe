worker_processes auto;
events { worker_connections 1024; }

http {
    charset       utf-8;
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        # Vue CLI 打包后的静态资源根目录（生产构建产物 dist/）
        root /usr/share/nginx/html;
        index index.html;

        # 1. 后端接口反向代理，保留 /api → 转发后去掉前缀（与 vue.config.js 的 pathRewrite 保持一致）
        location ^~ /api/ {
            proxy_pass http://wardrobe-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 20m;
        }

        # 2. SPA 路由回退 (history 模式)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 3. 静态资源强缓存
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
